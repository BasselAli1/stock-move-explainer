# Lints with ruff and runs the unit test suite on every push and pull
# request.
#
# The test suite only covers tests/ — the pure domain-logic functions
# (risk_factors, chunking, trigger, query builder) with no network/DB/
# API-key dependencies, so this runs identically here and on a local
# machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: .venv/bin/ruff check .

      - name: Run tests
        run: .venv/bin/pytest tests/ -v
